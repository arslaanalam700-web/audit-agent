# Production stack for a Linux VPS. Hermes binds the A2A ports on the host
# network so the lead agent on :9900 can be published by Caddy.
# On Docker Desktop for Windows, skip Caddy and run the engine with published ports only.

services:
  audit-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped

  hermes:
    image: nousresearch/hermes-agent:stable
    restart: unless-stopped
    network_mode: host
    volumes:
      - hermes-data:/opt/data
      - ../hermes/profiles:/profiles:ro
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      AUDIT_MCP_TOKEN: ${AUDIT_MCP_TOKEN}
      A2A_HOST: 127.0.0.1
    command: ["gateway", "run"]

  caddy:
    image: caddy:2
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  hermes-data:
  caddy-data:
